<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div id="container">
      <div id="sidebar">
        <div id="logo">
          <img src="./assets/Icons/view-dashboard.svg" alt="Dashboard Logo" />
          <h1>Dashboard</h1>
        </div>
        <ul>
          <li>
            <a href="#"
              ><img src="./assets/Icons/home.svg" alt="Home" /> Home</a
            >
          </li>
          <li>
            <a href="#"
              ><img
                src="./assets/Icons/card-account-details.svg"
                alt="Profile"
              />
              Profile</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/message.svg" alt="Messages" />
              Messages</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/clock-time-five.svg" alt="History" />
              History</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/note-multiple.svg" alt="Task" /> Task</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/account-group.svg" alt="Communities" />
              Communities</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/cog.svg" alt="Settings" /> Settings</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/help-box.svg" alt="Support" />
              Support</a
            >
          </li>
          <li>
            <a href="#"
              ><img src="./assets/Icons/shield-lock.svg" alt="Privacy" />
              Privacy</a
            >
          </li>
        </ul>
      </div>
      <div id="header">
        <h2>Dashboard Header</h2>
      </div>
      <div id="content">
        <h3>Dashboard Content</h3>
        <p>
          This is where the main content of the dashboard will be displayed.
        </p>
      </div>
    </div>
  </body>
</html>
